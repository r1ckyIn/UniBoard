version: 2

updates:
  # pip ecosystem removed — project uses uv with uv.lock;
  # Dependabot cannot update uv.lock, causing CI --locked failures

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # ky 2.0 introduces breaking hook signature changes (single state object),
      # prefixUrl rename, and .json() throwing on 204. Defer to a dedicated
      # post-v3.0 migration phase rather than absorbing it mid-milestone.
      - dependency-name: "ky"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
