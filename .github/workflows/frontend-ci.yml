name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  # Detect whether the PR touches files that can affect rendered pixels.
  # Output `ui=true` gates the downstream playwright-e2e job so non-UI
  # changes (RSC helpers, hooks, lib/, server config, unit tests, etc.)
  # skip the 2-minute pixel-diff suite. `check` (lint + typecheck +
  # build) still runs on every frontend PR so regressions in non-UI
  # code are caught.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect UI-affecting changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ui:
              - 'frontend/app/**'
              - 'frontend/components/**'
              - 'frontend/styles/**'
              - 'frontend/public/**'
              - 'frontend/tailwind.config.*'
              - 'frontend/postcss.config.*'
              - 'frontend/next.config.*'
              - 'frontend/playwright.config.ts'
              - 'frontend/tests/e2e/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - '.github/workflows/frontend-ci.yml'

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pin pnpm to the version declared in frontend/package.json
          # packageManager field. action-setup@v6 no longer infers this
          # reliably from package_json_file; explicit version avoids
          # accidental v11+ lockfile-format breakage.
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (TypeScript)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Phase 38 P04 — Playwright pixel-diff perf regression.
  #
  # Gated on `changes.outputs.ui == 'true'` — only runs when the PR
  # touches files listed in the `changes` job's filter (app/, components/,
  # styles/, public/, Tailwind/PostCSS/Next configs, Playwright config,
  # e2e specs, package.json/lockfile, this workflow file). Non-UI PRs
  # (RSC helpers, hooks, lib/, server-only code, unit tests) skip this
  # job entirely, saving ~2 minutes per iteration.
  #
  # Env-gated: when PERF_TEST_PASSWORD (or the Supabase env vars) is
  # absent, the spec's `test.skip(!shouldRunPerfSuite(), ...)` causes
  # all 6 cases to no-op. This keeps fork PRs (which never see
  # repository secrets) green without work, and only enforces the
  # pixel-diff on trusted branches where the secret is provisioned.
  #
  # When the secret IS present, a mismatch against any of the 6 committed
  # baselines fails CI and uploads the diff report as an artifact.
  playwright-e2e:
    name: Playwright E2E (pixel-diff)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}
      PERF_TEST_EMAIL: ${{ vars.PERF_TEST_EMAIL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      PLAYWRIGHT_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pin pnpm to the version declared in frontend/package.json
          # packageManager field. action-setup@v6 no longer infers this
          # reliably from package_json_file; explicit version avoids
          # accidental v11+ lockfile-format breakage.
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browsers between runs — the download is ~200 MB
      # of Chromium. Keyed on the pnpm lockfile so a Playwright bump
      # invalidates the cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Build + start the Next.js production bundle on port 3001 in the
      # background so the spec can hit a real RSC-rendered page. We
      # intentionally do NOT use playwright.config.ts's `webServer` field
      # here — separate steps give us clearer cache hits on build output
      # and individual failure visibility.
      - name: Build Next.js production bundle
        run: pnpm build

      - name: Start Next.js production server
        run: |
          # Next.js default port is 3000; pin to 3001 to match PLAYWRIGHT_BASE_URL
          # + project dev convention.
          pnpm exec next start -p 3001 &
          # Wait up to 60 s for the server to bind before running tests.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001 >/dev/null 2>&1; then
              echo "Next.js server ready on :3001 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Next.js server did not become ready on :3001 in 60s" >&2
          exit 1

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test-results diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 14
