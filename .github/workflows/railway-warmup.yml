name: Railway Warmup

# ACTIVE — pings `/health` every 10 minutes to keep the Railway container
# warm. Activated by Phase 38.2 (2026-04-22) per CONTEXT.md D-06. Railway
# Serverless idle threshold is 10 min of zero outbound packets; this cron
# plus the backend's `SELECT 1` in `/health` keeps the container awake.
#
# Endpoint fix: Phase 38-03 originally targeted the wrong endpoint (404 on
# backend). Corrected to /health in 38.2 per RESEARCH R5 (live curl check).
#
# To disable: re-comment the `schedule:` block (leading `# ` on both lines)
# and commit as `chore: disable railway warmup cron`.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes — keeps Railway warm (Phase 38.2 D-06)

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Public production URL — also listed in the app's CSP header
      # (`connect-src` directive). Secret-context lookup is retained so a
      # preview / staging override can be set via repo secret, but the
      # `||` fallback keeps the cron working on a fresh clone or when the
      # secret is unset. Phase 38.2 activation originally failed because
      # the secret was never configured; hardcoding the public URL as the
      # fallback is safe (no sensitive info exposed).
      RAILWAY_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.uniboard.uk' }}
    steps:
      - name: Ping /health
        run: |
          set -euo pipefail
          # -fsS: fail on non-2xx, silent unless error, show error
          # --max-time 15: bound request time; warmup is a cheap probe, not a
          # measurement — we don't want warmup to queue if Railway is mid-boot
          curl -fsS --max-time 15 "${RAILWAY_URL%/}/health" > /dev/null
          echo "Warmup ping OK (${RAILWAY_URL%/}/health)"
