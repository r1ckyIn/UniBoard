<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Virgil', 'Segoe UI', sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1e1e1e"/>
    </marker>
  </defs>

  <!-- Student -->
  <ellipse cx="470" cy="70" rx="90" ry="30" fill="#fef3c7" stroke="#1e1e1e" stroke-width="2"/>
  <text x="470" y="76" text-anchor="middle" font-size="18" fill="#1e1e1e">USyd Student</text>

  <!-- Frontend -->
  <rect x="340" y="160" width="260" height="80" rx="10" fill="#bae6fd" stroke="#1e1e1e" stroke-width="2"/>
  <text x="470" y="195" text-anchor="middle" font-size="18" fill="#1e1e1e">Next.js 15 Frontend</text>
  <text x="470" y="220" text-anchor="middle" font-size="15" fill="#1e1e1e">(Vercel, supabase-js)</text>

  <!-- Canvas API -->
  <rect x="60" y="300" width="200" height="70" rx="10" fill="#fde68a" stroke="#1e1e1e" stroke-width="2"/>
  <text x="160" y="342" text-anchor="middle" font-size="18" fill="#1e1e1e">Canvas LMS API</text>

  <!-- Ed Discussion API -->
  <rect x="680" y="300" width="200" height="70" rx="10" fill="#fde68a" stroke="#1e1e1e" stroke-width="2"/>
  <text x="780" y="342" text-anchor="middle" font-size="18" fill="#1e1e1e">Ed Discussion API</text>

  <!-- FastAPI -->
  <rect x="340" y="310" width="260" height="90" rx="10" fill="#bbf7d0" stroke="#1e1e1e" stroke-width="2"/>
  <text x="470" y="338" text-anchor="middle" font-size="18" fill="#1e1e1e">FastAPI Backend</text>
  <text x="470" y="360" text-anchor="middle" font-size="15" fill="#1e1e1e">(GPA + Deadlines + Sync)</text>
  <text x="470" y="382" text-anchor="middle" font-size="15" fill="#1e1e1e">Dedup via SHA-256</text>

  <!-- MCP -->
  <rect x="340" y="460" width="260" height="80" rx="10" fill="#fbcfe8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="470" y="495" text-anchor="middle" font-size="18" fill="#1e1e1e">MCP Server (17 tools)</text>
  <text x="470" y="520" text-anchor="middle" font-size="15" fill="#1e1e1e">Claude API</text>

  <!-- DB -->
  <rect x="60" y="460" width="200" height="80" rx="10" fill="#e0e7ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="160" y="493" text-anchor="middle" font-size="18" fill="#1e1e1e">Supabase Postgres</text>
  <text x="160" y="515" text-anchor="middle" font-size="15" fill="#1e1e1e">(15 tables, 60 RLS)</text>

  <!-- Insights -->
  <rect x="680" y="460" width="200" height="80" rx="10" fill="#fecaca" stroke="#1e1e1e" stroke-width="2"/>
  <text x="780" y="493" text-anchor="middle" font-size="18" fill="#1e1e1e">AI Insights</text>
  <text x="780" y="515" text-anchor="middle" font-size="15" fill="#1e1e1e">(GPA / Urgency / Digest)</text>

  <!-- Arrows -->
  <line x1="470" y1="100" x2="470" y2="160" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="240" x2="470" y2="310" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="260" y1="340" x2="340" y2="355" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="340" x2="600" y2="355" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="400" x2="470" y2="460" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="380" x2="260" y2="470" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="500" x2="680" y2="500" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
</svg>
