services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: uniboard_dev
      POSTGRES_USER: uniboard
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniboard -d uniboard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
