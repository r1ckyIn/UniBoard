[project]
name = "uniboard-mcp"
version = "1.0.0"
description = "MCP server for Canvas LMS, Ed Discussion, Ed Lessons, and USYD Unit Outline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
uniboard-mcp = "uniboard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniboard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
