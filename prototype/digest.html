<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBoard — Daily Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="https://unpkg.com/rough-notation/lib/rough-notation.iife.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --dark:#e8ddd0;--cream:#faf9f5;
      --orange:#d97757;--orange-soft:rgba(217,119,87,.11);
      --blue:#6a9bcc;--blue-soft:rgba(106,155,204,.11);
      --green:#788c5d;--green-soft:rgba(120,140,93,.11);
      --amber:#b08968;--amber-soft:rgba(176,137,104,.11);
      --purple:#9b7bb8;--purple-soft:rgba(155,123,184,.11);
      --red:#c45;--red-soft:rgba(204,68,85,.11);
      --card-bg:#f6f5f0;--card-bg-hover:#efede6;--card-border:#e8e5dd;
      --text-1:#2d2d2a;--text-2:#6b6b65;--text-3:#9b9b94;--divider:#eae7e0;
      --sidebar-w:68px;--sidebar-w-expanded:224px;--header-h:56px;
      --radius:14px;--radius-sm:8px;
      --shadow:0 1px 3px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.025);
      --shadow-hover:0 2px 8px rgba(20,20,19,.06),0 8px 24px rgba(20,20,19,.04);
      --ease:.28s cubic-bezier(.4,0,.2,1);--ease-fast:.15s ease;
    }
    html{font-size:15px;overflow-y:scroll}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--text-1);line-height:1.55;overflow-x:hidden;min-height:100vh;position:relative}
    body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E")}
    body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(139,115,85,.02) 31px,rgba(139,115,85,.02) 32px)}
    h1,h2,h3,h4,h5{font-family:'Source Serif 4',Georgia,serif;font-weight:600;color:var(--text-1);letter-spacing:-.01em}

    /* LAYOUT */
    .app{display:flex;min-height:100vh}

    /* SIDEBAR */
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--dark);display:flex;flex-direction:column;padding:20px 0;z-index:100;transition:width var(--ease);overflow:hidden;box-shadow:2px 0 16px rgba(20,20,19,.06)}
    .sidebar:hover{width:var(--sidebar-w-expanded)}
    .sidebar-logo{display:flex;align-items:center;gap:12px;padding:6px 17px 24px;white-space:nowrap}
    .logo-mark{width:34px;height:34px;background:var(--orange);border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-family:'Source Serif 4',serif;font-weight:700;font-size:17px;color:#fff}
    .logo-text{font-family:'Source Serif 4',serif;font-size:1.18rem;font-weight:700;color:#4a3f34;opacity:0;transition:opacity var(--ease)}
    .sidebar:hover .logo-text{opacity:1}
    .sidebar-rule{width:26px;height:1px;background:rgba(60,50,40,.1);margin:0 auto 10px;transition:width var(--ease)}
    .sidebar:hover .sidebar-rule{width:calc(100% - 44px)}
    .sidebar-nav{list-style:none;width:100%;flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
    .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;color:rgba(60,50,40,.65);cursor:pointer;transition:all var(--ease-fast);white-space:nowrap;overflow:hidden;text-decoration:none}
    .nav-item:hover{background:rgba(60,50,40,.06);color:rgba(60,50,40,.75)}
    .nav-item.active{background:rgba(217,119,87,.18);color:var(--orange)}
    .nav-icon{flex-shrink:0;width:20px;height:20px}
    .nav-label{font-size:.84rem;font-weight:500;opacity:0;transition:opacity var(--ease)}
    .sidebar:hover .nav-label{opacity:1}
    .sidebar-bottom{padding:0 10px;width:100%}

    /* MAIN WRAPPER */
    .main-wrapper{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

    /* HEADER */
    .header{position:sticky;top:0;z-index:50;height:var(--header-h);background:rgba(250,249,245,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
    .header-brand{font-family:'Source Serif 4',serif;font-size:.95rem;font-weight:600;color:var(--text-2)}
    .header-right{display:flex;align-items:center;gap:8px}
    .search-bar{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:7px 14px;width:220px}
    .search-bar input{border:none;background:none;outline:none;font-family:inherit;font-size:.82rem;color:var(--text-1);width:100%}
    .search-bar input::placeholder{color:var(--text-3)}
    .search-icon{color:var(--text-3);flex-shrink:0}
    .hdr-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);display:grid;place-items:center;cursor:pointer;color:var(--text-2);transition:all var(--ease-fast);position:relative}
    .hdr-btn:hover{background:var(--card-bg-hover)}
    .notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--orange);border-radius:50%;border:1.5px solid var(--card-bg)}
    .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--orange),#e8956e);display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;cursor:pointer;margin-left:4px}

    /* CONTENT AREA */
    .content-area{flex:1;padding:24px 28px;display:flex;gap:24px}
    .main-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
    .right-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(var(--header-h) + 24px);align-self:flex-start;max-height:calc(100vh - var(--header-h) - 48px);overflow-y:auto;overflow-x:hidden}
    .right-panel{scrollbar-width:none}
    .right-panel::-webkit-scrollbar{display:none}

    /* TITLE ROW */
    .dg-title-row{display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin-bottom:4px}
    .dg-title-left{display:flex;align-items:center;gap:10px}
    .dg-title-icon{width:22px;height:22px;color:var(--orange);flex-shrink:0}
    .dg-h1{font-family:'Source Serif 4',Georgia,serif;font-size:1.5rem;font-weight:700;color:var(--text-1);letter-spacing:-.02em}
    .dg-date-badge{font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--orange-soft);color:var(--orange)}
    .dg-title-right{display:flex;align-items:center;gap:8px}
    .dg-refresh-btn{display:flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-2);cursor:pointer;transition:all var(--ease-fast)}
    .dg-refresh-btn:hover{background:var(--card-bg-hover);color:var(--text-1)}
    .dg-generated{font-size:.72rem;color:var(--text-3);font-style:italic}

    /* CARD (shared) */
    .card{background:var(--card-bg);border:none;border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);transition:box-shadow var(--ease),transform var(--ease);position:relative;overflow:visible}
    .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
    .hand-border-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
    .card-title{font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--text-1)}
    .card-title-icon{flex-shrink:0}
    .card-badge{font-size:.68rem;padding:3px 9px;border-radius:6px;font-weight:600}

    /* URGENT BANNER */
    .urgent-banner{background:rgba(204,68,85,.04);border:1.5px solid rgba(204,68,85,.15);border-radius:var(--radius);padding:14px 20px;display:flex;align-items:center;gap:12px}
    .urgent-banner-icon{width:18px;height:18px;color:var(--red);flex-shrink:0}
    .urgent-banner-text{font-size:.82rem;color:var(--text-1);font-weight:500}
    .urgent-banner-text strong{color:var(--red);font-weight:700}
    .urgent-banner-count{font-family:'Source Serif 4',serif;font-size:1.1rem;font-weight:700;color:var(--red);margin-left:auto;flex-shrink:0}

    /* COURSE DIGEST SECTION */
    .course-section{position:relative;overflow:visible}
    .course-section-wrap{background:var(--card-bg);border:1.5px solid #d0cdc4;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative;transition:box-shadow var(--ease-fast)}
    .course-section-wrap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe-color,#d0cdc4);z-index:3;pointer-events:none}
    .course-section:hover .course-section-wrap{box-shadow:var(--shadow-hover)}

    .course-section-header{padding:16px 20px 14px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--divider)}
    .cs-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .cs-code{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:.95rem;color:var(--text-1)}
    .cs-name{font-size:.72rem;color:var(--text-3);margin-left:2px}
    .cs-count-badge{font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:5px;margin-left:auto;white-space:nowrap;flex-shrink:0}

    /* HIGHLIGHT ITEM */
    .highlight-list{padding:6px 20px 14px 24px}
    .hl-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);transition:background var(--ease-fast)}
    .hl-item:last-child{border-bottom:none}
    .hl-item:hover{background:rgba(0,0,0,.01);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--radius-sm)}
    .hl-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
    .hl-icon.grade{background:var(--green-soft);color:var(--green)}
    .hl-icon.staff{background:var(--blue-soft);color:var(--blue)}
    .hl-icon.endorsed{background:var(--amber-soft);color:var(--amber)}
    .hl-icon.announcement{background:var(--orange-soft);color:var(--orange)}
    .hl-icon.deadline-change{background:var(--purple-soft);color:var(--purple)}
    .hl-icon.exam{background:var(--red-soft);color:var(--red)}
    .hl-body{flex:1;min-width:0}
    .hl-type{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
    .hl-summary{font-size:.84rem;color:var(--text-1);font-weight:500;line-height:1.45}
    .hl-meta{font-size:.7rem;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:6px}
    .hl-urgency{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:2px}
    .hl-urgency.critical{background:var(--red-soft);color:var(--red)}
    .hl-urgency.important{background:var(--orange-soft);color:var(--orange)}
    .hl-urgency.informational{background:var(--green-soft);color:var(--green)}

    /* RIGHT PANEL CARDS */
    .panel-card{background:var(--card-bg);border:none;border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);transition:box-shadow var(--ease),transform var(--ease);position:relative;overflow:visible}
    .panel-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
    .panel-card-title{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:14px;color:var(--text-1)}
    .panel-card-title-icon{color:var(--orange);flex-shrink:0}

    /* URGENT DEADLINES (right panel) */
    .udl-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
    .udl-item:last-child{border-bottom:none}
    .udl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .udl-info{flex:1;min-width:0}
    .udl-title{font-size:.8rem;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .udl-course{font-size:.68rem;color:var(--text-3)}
    .udl-days{font-size:.68rem;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0}
    .udl-days.urgent{background:var(--red-soft);color:var(--red)}
    .udl-days.soon{background:var(--orange-soft);color:var(--orange)}
    .udl-days.later{background:var(--green-soft);color:var(--green)}

    /* DIGEST HISTORY (right panel) */
    .dh-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider);cursor:pointer;transition:background var(--ease-fast)}
    .dh-item:last-child{border-bottom:none}
    .dh-item:hover{background:rgba(0,0,0,.015);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:var(--radius-sm)}
    .dh-item.current{background:var(--orange-soft);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:var(--radius-sm)}
    .dh-date{font-size:.78rem;font-weight:600;color:var(--text-1);flex:1;min-width:0}
    .dh-count{font-size:.66rem;font-weight:600;color:var(--text-3)}
    .dh-arrow{width:14px;height:14px;color:var(--text-3);flex-shrink:0}

    /* DIGEST STATS (right panel) */
    .ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ds-stat{background:rgba(250,249,245,.55);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
    .ds-val{font-family:'Source Serif 4',serif;font-size:1.1rem;font-weight:700}
    .ds-lbl{font-size:.64rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:48px 24px;color:var(--text-3)}
    .empty-state-icon{width:48px;height:48px;color:var(--card-border);margin:0 auto 16px}
    .empty-state-text{font-size:.88rem;font-style:italic}

    /* ANIMATIONS */
    @keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .anim{opacity:0;animation:slideUp .6s cubic-bezier(.16,1,.3,1) forwards}
    .d1{animation-delay:.04s}.d2{animation-delay:.09s}.d3{animation-delay:.14s}
    .d4{animation-delay:.19s}.d5{animation-delay:.28s}.d6{animation-delay:.38s}
    .d7{animation-delay:.48s}.d8{animation-delay:.56s}.d9{animation-delay:.64s}
    .d10{animation-delay:.72s}

    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px}

    /* RESPONSIVE */
    @media(max-width:1200px){.right-panel{display:none}}
    @media(max-width:900px){.content-area{padding:16px 12px}.dg-title-row{flex-direction:column;align-items:flex-start;gap:10px}}
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">U</div><span class="logo-text">UniBoard</span></div>
    <div class="sidebar-rule"></div>
    <ul class="sidebar-nav">
      <li><a class="nav-item" href="dashboard.html"><i data-lucide="layout-dashboard" class="nav-icon"></i><span class="nav-label">Dashboard</span></a></li>
      <li><a class="nav-item" href="timetable.html"><i data-lucide="table" class="nav-icon"></i><span class="nav-label">Timetable</span></a></li>
      <li><a class="nav-item" href="courses.html"><i data-lucide="book-open" class="nav-icon"></i><span class="nav-label">Courses</span></a></li>
      <li><a class="nav-item" href="deadline.html"><i data-lucide="calendar" class="nav-icon"></i><span class="nav-label">Deadlines</span></a></li>
      <li><a class="nav-item" href="predict.html"><i data-lucide="target" class="nav-icon"></i><span class="nav-label">Predict</span></a></li>
      <li><a class="nav-item active" href="digest.html"><i data-lucide="radio" class="nav-icon"></i><span class="nav-label">Digest</span></a></li>
    </ul>
    <div class="sidebar-bottom"><a class="nav-item" href="#"><i data-lucide="settings" class="nav-icon"></i><span class="nav-label">Settings</span></a></div>
  </aside>

  <div class="main-wrapper">
    <!-- HEADER -->
    <header class="header">
      <div class="header-brand">UniBoard</div>
      <div class="header-right">
        <div class="search-bar"><i data-lucide="search" class="search-icon" style="width:15px;height:15px"></i><input type="text" placeholder="Search courses, files&hellip;"></div>
        <button class="hdr-btn"><i data-lucide="bell" style="width:17px;height:17px"></i><span class="notif-dot"></span></button>
        <div class="avatar">RQ</div>
      </div>
    </header>

    <div class="content-area">
      <div class="main-content">
        <!-- TITLE ROW -->
        <div class="dg-title-row anim d1">
          <div class="dg-title-left">
            <i data-lucide="radio" class="dg-title-icon"></i>
            <h1 class="dg-h1">Daily Digest</h1>
            <span class="dg-date-badge">Thu, 20 Mar</span>
          </div>
          <div class="dg-title-right">
            <span class="dg-generated">Generated 2 hours ago</span>
            <button class="dg-refresh-btn"><i data-lucide="refresh-cw" style="width:13px;height:13px"></i> Refresh</button>
          </div>
        </div>

        <!-- COURSE DIGEST SECTIONS -->
        <div id="digest-sections">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel" id="right-panel">
        <!-- Digest Stats -->
        <div class="panel-card anim d5" data-hand-border>
          <div class="panel-card-title"><i data-lucide="bar-chart-3" class="panel-card-title-icon" style="width:16px;height:16px"></i> Today's Summary</div>
          <div class="ds-grid">
            <div class="ds-stat"><div class="ds-val" style="color:var(--orange)">12</div><div class="ds-lbl">Updates</div></div>
            <div class="ds-stat"><div class="ds-val" style="color:var(--blue)">5</div><div class="ds-lbl">Courses</div></div>
            <div class="ds-stat"><div class="ds-val" style="color:var(--green)">3</div><div class="ds-lbl">Grades</div></div>
            <div class="ds-stat"><div class="ds-val" style="color:var(--red)">2</div><div class="ds-lbl">Urgent</div></div>
          </div>
        </div>


        <!-- Digest History -->
        <div class="panel-card anim d7" data-hand-border>
          <div class="panel-card-title"><i data-lucide="clock" class="panel-card-title-icon" style="width:16px;height:16px"></i> Recent Digests</div>
          <div id="dh-list">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  'use strict';
