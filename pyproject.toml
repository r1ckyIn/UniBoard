[project]
name = "uniboard"
version = "0.1.0"
description = "University GPA Maximization Dashboard - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.2,<5.0",
    "httpx>=0.28,<1.0",
    "beautifulsoup4>=4.13,<5.0",
    "lxml>=5.3,<6.0",
    "structlog>=24.0,<27.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "cryptography>=43,<45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-timeout>=2.3,<3.0",
    "mypy>=1.13,<2.0",
    "ruff>=0.8,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-timeout>=2.3,<3.0",
    "mypy>=1.13,<2.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 120

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI uses Depends() in function parameter defaults by design
"src/web/**" = ["B008"]
"src/security/auth.py" = ["B008"]
